version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: NewSecurePassword123!
      MYSQL_DATABASE: stack
    ports:
      - "3307:3306"   # host:container — avoids clashing with a local MySQL on 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pNewSecurePassword123!"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://root:NewSecurePassword123!@db:3306/stack"
      AUTH_SECRET: "phase5-dev-secret-change-me"
      AUTH_COOKIE_SECURE: "false"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: